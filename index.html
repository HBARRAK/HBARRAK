### كيف تستخدم ميزة التعديل والحذف الآن؟

1. **دخول لوحة التحكم:**
   انقر على أيقونة المفتاح الذهبي 🔑 في شريط التصفح العلوي، وأدخل كلمة السر الخاصّة بك.

2. **عرض جميع المقالات (تبويب إدارة المقالات):**
   ستجد تبويباً جديداً باسم **"إدارة المقالات (تعديل / حذف)"** يُظهر لك قائمة بجميع المقالات الحالية.

3. **تعديل مقال:**
   * اضغط على زر **"تعديل"** بجانب المقال المطلوب.
   * سيتم تعبئة كامل بيانات المقال تلقائياً في النموذج.
   * بعد الانتهاء من التعديلات اضغط **"حفظ التعديلات على المقال"**.

4. **حذف مقال:**
   * اضغط على زر **"حذف"** بجانب المقال لنقله خارج الأرشيف فوراً، وسيتم تحديث الفضاء الفكري (الكانفا) والأرشيف المقالي تلقائياً.
